<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sorting Algorithm Visualizer</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body data-theme="dark">
  <header class="app-header">
    <h1>Sorting Algorithm Visualizer</h1>

    <div class="theme-toggle">
      <label class="switch">
        <input type="checkbox" id="themeToggle" checked />
        <span class="slider"></span>
      </label>
      <span>Dark</span>
    </div>
  </header>

  <section class="controls">
    <div class="control-row">
      <div class="control">
        <label for="algorithm">Algorithm</label>
        <select id="algorithm">
          <option value="bubble">Bubble Sort</option>
          <option value="selection">Selection Sort</option>
          <option value="insertion">Insertion Sort</option>
          <option value="merge">Merge Sort</option>
          <option value="quick">Quick Sort</option>
        </select>
      </div>

      <div class="control">
        <label for="size">Array Size: <span id="sizeLabel">20</span></label>
        <input type="range" id="size" min="5" max="100" value="20"/>
      </div>

      <div class="control">
        <label for="speed">Speed (ms): <span id="speedLabel">300</span></label>
        <input type="range" id="speed" min="10" max="1000" value="300" step="10"/>
      </div>
    </div>

    <div class="buttons">
      <button id="generate" class="btn primary">Generate Array</button>
      <button id="sort" class="btn success">Start Sorting</button>
      <button id="pause" class="btn warning" disabled>Pause</button>
      <button id="resume" class="btn info" disabled>Resume</button>
      <button id="reset" class="btn" disabled>Reset</button>
    </div>
  </section>

  <section class="stats">
    <div class="stat">
      <strong>Best:</strong> <span id="best">—</span>
    </div>
    <div class="stat">
      <strong>Average:</strong> <span id="avg">—</span>
    </div>
    <div class="stat">
      <strong>Worst:</strong> <span id="worst">—</span>
    </div>
    <div class="stat">
      <strong>Comparisons:</strong> <span id="comparisons">0</span>
    </div>
    <div class="stat">
      <strong>Swaps/Moves:</strong> <span id="swaps">0</span>
    </div>
  </section>

  <main id="array-container" aria-label="Visualization area"></main>

  <footer class="footnote">
    <p>Tip: Use Pause/Resume to study each step. Switch theme for better visibility.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
